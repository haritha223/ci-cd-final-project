name: Simple Interest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Lint with flake8
        run: |
          python -m pip install flake8
          flake8 test_simple_interest.py

      - name: Run unit tests with nose
        run: |
          python -m pip install nose
          nosetests -v

      - name: Run Bash test
        run: bash test_simple_interest.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
