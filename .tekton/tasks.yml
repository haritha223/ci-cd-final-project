apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  steps:
    - name: cleanup
      image: alpine:3.14
      script: |
        echo "Cleaning up temporary files and resources..."
        rm -rf /tmp/*
        echo "Cleanup completed successfully"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test-task
spec:
  steps:
    - name: run-tests
      image: python:3.9
      script: |
        echo "Running unit tests with nose..."
        pip install nose
        bash test_simple_interest.sh
        echo "Tests completed successfully"
