apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.14
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        set -eu
        : "${WORKSPACE_SOURCE_PATH:?WORKSPACE_SOURCE_PATH is required}"
        if [ "$WORKSPACE_SOURCE_PATH" = "/" ]; then
          echo "Refusing to clean the filesystem root" >&2
          exit 1
        fi
        echo "Cleaning up workspace: $WORKSPACE_SOURCE_PATH"
        find "$WORKSPACE_SOURCE_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Workspace cleanup completed successfully"

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test-task
spec:
  steps:
    - name: nose-test
      image: python:3.9
      script: |
        set -eu
        echo "Running unit tests with nose..."
        pip install nose
        nosetests -v
        bash test_simple_interest.sh
        echo "Tests completed successfully"
